<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Arial, Calibri e gli altri font Microsoft non sono distribuibili nell'immagine.
  Questi alias usano font open source con le stesse metriche (stessa larghezza dei caratteri).
  Se la cartella ./fonts contiene i font originali (con licenza), fontconfig preferisce quelli.
-->
<fontconfig>
  <dir>/usr/share/fonts/custom</dir>
  <alias><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias><family>Calibri</family><prefer><family>Carlito</family></prefer></alias>
  <alias><family>Times New Roman</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <alias><family>Verdana</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
