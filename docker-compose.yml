name: watermarker
services:
  watermarker:
    image: watermarker:full             # meglio da registry: registro/watermarker:1.0.0
    restart: unless-stopped
    environment:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # ... come nel compose attuale
    # read_only, tmpfs, cap_drop, limiti: come nel compose attuale
    networks:
      edge:
        aliases: [watermarker]          # il nome con cui lo trova Caddy
      backend: {}

  converter:                            # solo nella variante con Gotenberg
    image: gotenberg/gotenberg:8
    networks: [backend]                 # non è su edge: Caddy e app2 non lo vedono

networks:
  edge:
    external: true
  backend:
    internal: true                      # nessun accesso a Internet