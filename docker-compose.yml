# Watermarker - installazione standard
#
#   cp .env.example .env      (poi adatta i valori)
#   docker compose up -d --build
#
# Servizi:
#   proxy        Caddy: HTTPS e unico punto esposto all'esterno
#   watermarker  portale + motore, con LibreOffice e FFmpeg (immagine "full")
#
# Per spostare la conversione in PDF in un container separato vedi docker-compose.split.yml.

name: watermarker

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      MAX_BODY: ${MAX_BODY:-110MB}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      watermarker:
        condition: service_healthy

  watermarker:
    build:
      context: .
      target: full
    image: watermarker:full
    restart: unless-stopped
    expose:
      - "8080"                      # raggiungibile solo dal proxy, non dall'esterno
    environment:
      # Il proxy inoltra schema e IP originali (serve anche per il login con Entra ID).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      Portal__MaxUploadMb: ${MAX_UPLOAD_MB:-100}
      Portal__MaxConcurrentJobs: ${MAX_CONCURRENT_JOBS:-2}
      Portal__QueueLimit: ${QUEUE_LIMIT:-20}
      Portal__ConversionTimeoutSeconds: ${CONVERSION_TIMEOUT_SECONDS:-120}
      Portal__VideoTimeoutMinutes: ${VIDEO_TIMEOUT_MINUTES:-30}
      TZ: ${TZ:-Europe/Rome}        # per {date} e {time}
      # Login con Microsoft Entra ID (vuoti = login disattivato)
      AzureAd__TenantId: ${AZUREAD_TENANT_ID:-}
      AzureAd__ClientId: ${AZUREAD_CLIENT_ID:-}
      AzureAd__ClientSecret: ${AZUREAD_CLIENT_SECRET:-}
      Portal__RequiredRole: ${REQUIRED_ROLE:-}
      Portal__AdminRole: ${ADMIN_ROLE:-Watermark.Admin}
      # API per le altre applicazioni (token gestiti dalla pagina admin.html)
      Api__Enabled: ${API_ENABLED:-true}
      Api__AsyncWorkers: ${API_ASYNC_WORKERS:-1}
      Api__MaxQueuedJobs: ${API_MAX_QUEUED_JOBS:-50}
      Api__ResultRetentionHours: ${API_RESULT_RETENTION_HOURS:-24}
      Api__DefaultRequestsPerMinute: ${API_DEFAULT_REQUESTS_PER_MINUTE:-60}
      Api__DefaultMaxActiveJobs: ${API_DEFAULT_MAX_ACTIVE_JOBS:-5}
    # Hardening: il container elabora file caricati dagli utenti.
    read_only: true
    tmpfs:
      - /tmp:size=${TMP_SIZE:-2g},mode=1777   # unico spazio scrivibile: i documenti non toccano mai il disco
    volumes:
      - ./fonts:/usr/share/fonts/custom:ro    # font con licenza (Arial, Calibri...), facoltativi
      - keys:/data/keys                       # chiavi dei cookie di sessione: sopravvivono ai riavvii
      - api:/data/api                         # token delle API (solo impronte, non i segreti)
      - jobs:/data/jobs                       # file dei lavori asincroni, cancellati alla scadenza
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEMORY_LIMIT:-3g}

volumes:
  keys:           # chiavi Data Protection del portale
  api:            # token delle API
  jobs:           # lavori asincroni delle API
  caddy_data:     # certificati emessi da Caddy
  caddy_config:
